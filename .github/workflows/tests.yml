name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.11.0, stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        env:
          NVIM_VERSION: ${{ matrix.neovim }}
        run: |
          curl -fL "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: sh tests/run.sh --output "$RUNNER_TEMP/test-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
